[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    needs_server: test e2e nécessitant un serveur MCP live — SKIP sous pytest si injoignable (issue #64)
    needs_s3: test e2e nécessitant un S3 configuré — SKIP sous pytest si non configuré (issue #64)
