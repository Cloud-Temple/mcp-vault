# Valeurs propres au dépôt, hors empreintes du corpus.
# Trois états : une valeur, disabled quand le champ le permet, TO_FILL si
# non traité. Ne pas supprimer une clé pour contourner le contrôle.
# Schéma 4 : un connecteur Hivemind et un espace pour SHORT, MID et LONG.
# Migrer les données et le connecteur avant d'adopter ce profil. L'updater
# préserve la configuration ; il ne réalise pas cette migration.
schema_version: 4

project:
  name: TO_FILL
  public_language: TO_FILL
  # Fichier du dépôt décrivant le projet, sans workflow concurrent ;
  # disabled si le projet n'en a pas. Chemin relatif ne sortant pas du dépôt.
  instructions_file: TO_FILL

memory:
  # Alias du connecteur MCP autorisé, tel qu'il figure dans le client.
  # Vérifier son endpoint dans la configuration MCP ; un alias ne prouve pas
  # l'identité d'une instance. Aucun endpoint ou secret dans ce fichier.
  server: TO_FILL
  # Identifiant exact de l'espace Hivemind, commun aux trois horizons.
  space_id: TO_FILL
  # Entier strictement positif en heures. disabled désactive cette seule
  # échéance, pas les contrôles à la reprise et aux jalons. Aucun minuteur.
  consolidation_check_interval_hours: 24

review:
  # Fournisseur du relecteur indépendant : claude, codex ou llmaas.
  # Les modèles restent définis dans REVIEWERS.md.
  reviewer_provider: TO_FILL
