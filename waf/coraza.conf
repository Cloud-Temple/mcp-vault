# Configuration Coraza WAF pour MCP Vault
#
# Ce fichier est chargé par la directive coraza_waf dans le Caddyfile.
# Il configure le moteur de règles, charge les OWASP CRS v4, et définit
# des exceptions spécifiques à l'API MCP.
#
# Stratégie WAF :
#   - Mode BLOCKING sur TOUS les endpoints (health, /mcp, /admin/api)
#   - Exclusions de RÈGLES (ctl:ruleRemoveById) AVANT l'Include CRS  → cf. #42
#   - Exclusions de CIBLES (SecRuleUpdateTargetById) APRÈS l'Include → cf. #107
#   - Parseur JSON activé sur POST /mcp uniquement (prérequis du scoping fin)
#   - Fine-tuning complété le 2026-03-23 — 295/295 tests e2e validés
#
# Documentation : https://coraza.io/docs/seclang/directives/

# ── Moteur de règles ───────────────────────────────────────────────
SecRuleEngine On

# ── Accès au corps des requêtes/réponses ───────────────────────────
SecRequestBodyAccess On
SecResponseBodyAccess Off

# ── Limites de taille (adapté aux payloads MCP JSON) ──────────────
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 5242880
# Explicite plutôt qu'implicite : un corps dépassant la limite est REFUSÉ, jamais
# analysé partiellement. Une analyse partielle laisserait passer la fin du corps
# sans inspection — d'autant plus depuis l'activation du parseur JSON (#107).
SecRequestBodyLimitAction Reject

# ── Profondeur JSON maximale (issue #107) ─────────────────────────
# INDISSOCIABLE de l'activation du parseur JSON plus bas. `SecRequestBodyLimit`
# borne les OCTETS, jamais la PROFONDEUR : un corps `[`×N + `0` + `]`×N est un
# JSON valide qui coûte 2 octets par niveau, et le parseur alloue une clé de map
# par niveau (coût quadratique). Sur coraza 3.3.3, qui n'avait pas cette
# directive, 15 Ko suffisaient à faire tomber le WAF en OOM — d'où la montée à
# coraza-caddy v2.5.0 / coraza v3.7.0 (cf. waf/Dockerfile).
#
# 32 est très large : l'enveloppe MCP la plus profonde légitime atteint 5 niveaux
# (`params._meta.x-codex-turn-metadata.environment.cwd`) et le payload de secret
# 4 (`params.arguments.data.<champ>`). Cela laisse 6x de marge pour un secret
# dont la valeur serait elle-même une structure imbriquée.
SecRequestBodyJsonDepthLimit 32

# ── Logging ────────────────────────────────────────────────────────
SecAuditEngine RelevantOnly
SecAuditLogFormat JSON

# ── Méthodes HTTP autorisées (avant chargement CRS) ───────────────
# Le protocole MCP utilise DELETE pour fermer les sessions SSE.
# L'API admin utilise PUT pour mettre à jour les tokens.
SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# ══════════════════════════════════════════════════════════════════
# EXCLUSIONS RUNTIME — DOIVENT PRÉCÉDER L'INCLUDE DU CRS (issue #42)
# ══════════════════════════════════════════════════════════════════
#
# CRITIQUE : `ctl:ruleRemoveById` ne retire qu'une règle PAS ENCORE évaluée
# dans la transaction. Coraza évalue les règles d'une même phase dans l'ordre
# du fichier. Beaucoup de règles CRS sont en phase:1 (ex. 920440, 920540).
# Si ces exclusions sont placées APRÈS l'Include CRS, la règle ciblée s'est
# déjà exécutée (et a scoré) avant que le `ctl` ne s'applique → exclusion
# inopérante, blocage en phase:2 sur le score accumulé (949110).
#
# Pattern CRS standard « exclusions before CRS » (REQUEST-900-EXCLUSION-RULES-
# BEFORE-CRS) : on déclare ces `ctl` en phase:1 AVANT les Include ci-dessous,
# pour qu'ils retirent les règles ciblées de la transaction avant leur
# évaluation — phase:1 comprise.
#
# Historique : les exclusions 920540 (v0.5.1) et 920440 (#37, v0.6.4) étaient
# placées après l'Include → inopérantes (#42). Seul 932120 (phase:2) marchait.

# --- 920540 "Unicode bypass" : faux positif sur les accents JSON-RPC (é) ---
#     Scope : /mcp (JSON-RPC) et /admin/api (REST JSON).
SecRule REQUEST_URI "@beginsWith /mcp" \
    "id:10001,phase:1,pass,nolog,\
     ctl:ruleRemoveById=920540"

SecRule REQUEST_URI "@beginsWith /admin/api" \
    "id:10002,phase:1,pass,nolog,\
     ctl:ruleRemoveById=920540"

# --- 932120 "PowerShell RCE" : faux positif sur "test-path", noms d'outils MCP ---
#     Scope : /mcp et /admin/api.
SecRule REQUEST_URI "@beginsWith /mcp" \
    "id:10003,phase:1,pass,nolog,\
     ctl:ruleRemoveById=932120"

SecRule REQUEST_URI "@beginsWith /admin/api" \
    "id:10004,phase:1,pass,nolog,\
     ctl:ruleRemoveById=932120"

# --- Distribution CA/CRL publique (non-auth par design PKI) ---
#     920440 "URL file extension restricted" bloque l'extension .pem ;
#     retirée UNIQUEMENT sur les 3 fichiers connus (regex strictement ancrée).
SecRule REQUEST_URI "@rx ^/pki/ca/(root|chain|crl)\.pem$" \
    "id:10005,phase:1,pass,nolog,\
     ctl:ruleRemoveById=920440,\
     ctl:ruleRemoveById=920540,\
     ctl:ruleRemoveById=932120"

# --- Protocole ACME RFC 8555 (auth via JWS, pas Bearer) ---
#     920420 : ACME utilise Content-Type "application/jose+json" (JWS), non
#     autorisé par la politique CRS par défaut → exclu sur les paths ACME POST.
#     Le sous-arbre ACME complet est couvert : endpoints fixes (directory,
#     new-*) ET dynamiques (authorization/<id>, challenge/<id>/..., order/<id>,
#     order/<id>/finalize, certificate/<id>). Les paths sont validés
#     anti-traversal par PkiMiddleware en amont (_SAFE_ACME_SUFFIX).
SecRule REQUEST_URI "@rx ^/acme/[a-zA-Z0-9/_\-]{1,256}$" \
    "id:10006,phase:1,pass,nolog,\
     ctl:ruleRemoveById=920420,\
     ctl:ruleRemoveById=920540,\
     ctl:ruleRemoveById=932120"

# --- Path long ACME généré par OpenBao dans les réponses directory ---
SecRule REQUEST_URI "@rx ^/v1/_sys_pki_int/acme/[a-zA-Z0-9/_\-]{1,256}$" \
    "id:10007,phase:1,pass,nolog,\
     ctl:ruleRemoveById=920420,\
     ctl:ruleRemoveById=920540,\
     ctl:ruleRemoveById=932120"

# --- Parseur JSON sur POST /mcp : PRÉREQUIS de tout scoping fin (issue #107) ---
#     Sans `ctl:requestBodyProcessor=JSON`, Coraza applique le processeur
#     URLENCODED au corps JSON-RPC. Mesuré sur Coraza 3.3.3 / CRS 4.7.0 :
#     le CORPS ENTIER devient UNE seule variable, à la fois nom et valeur —
#         ARGS_NAMES:{"jsonrpc": "2.0", "method": "tools/call", ...}
#     Deux conséquences :
#       1. toute chaîne de `lfi-os-files.data` présente N'IMPORTE OÙ dans le
#          corps — valeurs de secret incluses — matche 930120 via ARGS_NAMES.
#          C'est la cause du blocage de `secret_write` dès qu'un champ contient
#          `.env` (le type de secret `env_file` était donc inutilisable) ;
#       2. aucune exclusion ciblée n'est possible : il n'existe qu'une cible.
#     Le parseur JSON restaure la granularité réelle
#     (`json.params.arguments.data.notes`, `json.params.arguments.path`, …) ET
#     renforce la détection : 930100/930110 (path traversal) se déclenchent
#     désormais sur `path`, ce qui n'était pas le cas auparavant.
#     Scope volontairement limité à POST /mcp — /admin/api, PKI et ACME
#     conservent exactement leur comportement actuel (corps non parsé).
#     Chemin ancré (`^/mcp(?:[/?]|$)`) et non `@beginsWith /mcp`, qui matcherait
#     aussi `/mcpfoo`. `tx.mcp_json_body` marque la transaction : ce drapeau est
#     côté serveur, donc NON forgeable par le client, et sert de garde ci-dessous.
#
#     ⚠️ La grammaire du `Content-Type` doit couvrir TOUT ce que le handler accepte,
#     sinon le POST atteint l'application en échappant aux quatre protections
#     ci-dessous (parseur, borne 64 Ko, limite de profondeur, règle 10011).
#     `mcp/server/streamable_http.py:415` (SDK 1.26) :
#         parts = [p.strip() for p in ct.split(";")[0].split(",")]
#         return any(p == "application/json" for p in parts)
#     Donc `text/plain, application/json` EST accepté par le handler. Un ancrage en
#     `^application/json` le laissait passer sans aucune des bornes — mesuré.
#     D'où `(?:^|,)` : on reconnaît `application/json` comme jeton de média, en
#     tête ou après une virgule. Sur-couvrir est sans risque (on borne davantage) ;
#     sous-couvrir rouvre le contournement. `application/jsonp` et
#     `application/json-patch+json` ne matchent toujours pas — le caractère qui
#     suit `json` doit être `;`, `,` ou la fin de chaîne.
#     ⚠️ Le drapeau DOIT être initialisé : une `SecRule TX:<var>` dont la
#     variable n'existe pas ne s'évalue pas du tout (aucune variable à tester →
#     aucun match → la chaîne de la garde 10010 ne se termine jamais). Sans cette
#     initialisation, la garde 10010 était silencieusement inopérante — mesuré.
SecAction "id:10007100,phase:1,pass,nolog,setvar:'tx.mcp_json_body=0'"

SecRule REQUEST_METHOD "@streq POST" \
    "id:10008,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@rx ^/mcp(?:[/?]|$)" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?:^|,)[ \t]*application/json[ \t]*(?:[;,]|$)" \
        "t:lowercase,\
         ctl:requestBodyLimit=65536,\
         ctl:requestBodyProcessor=JSON,\
         setvar:'tx.mcp_json_body=1'"

# --- Borne DoS de la surface analysée en JSON (issue #107) --------------------
#     `ctl:requestBodyLimit=65536` ci-dessus, combiné à SecRequestBodyLimitAction
#     Reject, borne le coût du parseur. Le parseur JSON de Coraza 3.3.3 récurse
#     sans plafond de profondeur (`readItems()` porte un « TODO add some anti DOS
#     protection ») : SecRequestBodyLimit borne les OCTETS, jamais la PROFONDEUR.
#
#     Coûts mesurés sur un conteneur aux limites de production (512 Mo / 1 CPU),
#     corps JSON purement imbriqué (`{"a":` répété) :
#
#       corps      sans parseur (HEAD)   avec parseur      avec parseur + borne
#       ---------  -------------------   ---------------   --------------------
#       29 Ko          213 ms               148 ms              191 ms
#       293 Ko       2 043 ms             8 052 ms            413 en 2 ms
#       2,9 Mo      20 386 ms             > 30 s (timeout)    413 en 2 ms
#
#     Deux enseignements :
#       1. le DoS par gros corps PRÉEXISTE au correctif — 20 s de CPU pour une
#          seule requête de 2,9 Mo sur la configuration actuelle. Tracé à part ;
#       2. le parseur l'amplifiait ~4x ; la borne le supprime sur cette surface,
#          qui devient donc MEILLEURE qu'avant le correctif.
#
#     64 Ko est très large pour ce produit : un `secret_write` portant un
#     certificat TLS avec sa chaîne et sa clé privée pèse ~10-15 Ko, un contenu
#     `env_file` quelques Ko, une clé publique SSH moins d'1 Ko. Un corps MCP
#     au-delà de 64 Ko reçoit un 413 explicite et diagnosticable.
#     Portée : POST /mcp uniquement. Les autres endpoints conservent
#     SecRequestBodyLimit (10 Mo) — et donc le coût préexistant.

# --- Anti-évasion des exclusions de cibles `json.*` (issue #107) -------------
#     Les deux `SecRuleUpdateTargetById` déclarés après l'Include ciblent des
#     NOMS d'arguments préfixés `json.`. On avait d'abord supposé ces exclusions
#     « inertes hors /mcp par construction ». C'EST FAUX, et c'est mesuré :
#     `ARGS`/`ARGS_NAMES` agrègent AUSSI les paramètres de query string et de
#     formulaire, dont le nom est choisi par le client. Sans les gardes
#     ci-dessous, `GET /health?json.params.arguments.data.x=.env` répondait 200
#     alors que `GET /health?legit=.env` répondait 403 — soit une évasion globale
#     de la règle 930120 par simple choix du nom de paramètre.
#     Ces gardes rendent le préfixe INATTEIGNABLE ailleurs, au lieu de le
#     supposer : la propriété est désormais imposée, pas espérée.
#
#     Aucun client légitime n'a de raison d'envoyer un paramètre nommé `json.*` :
#     le transport MCP Streamable HTTP place tout dans le corps JSON, et
#     l'authentification est Bearer-only (pas de repli `?token=`).

# --- Refus explicite d'un corps JSON non analysable (issue #107) --------------
#     SANS cette règle, `SecRequestBodyJsonDepthLimit` échange un DoS contre une
#     ÉVASION SILENCIEUSE : au-delà de la limite, coraza cesse d'alimenter ARGS
#     et le corps n'est plus inspecté du tout. Mesuré avant cette règle, sur
#     coraza 3.7.0 avec la limite à 32 : une LFI, une SQLi, une XSS et une RCE
#     enfouies à 40 niveaux passaient TOUTES en 200. À 31 niveaux, toutes bloquées.
#
#     coraza 3.7.0 expose la condition : `REQBODY_ERROR=1`, message
#     « JSON: max recursion reached while reading json object ». On refuse donc
#     explicitement — un corps que le WAF ne peut pas inspecter n'atteint pas
#     l'application. mcp-vault ne saurait de toute façon rien faire d'un corps
#     JSON dépassant 32 niveaux d'imbrication.
#
#     Portée : la seule surface analysée en JSON (`tx.mcp_json_body`), donc
#     POST /mcp. Les autres endpoints ne sont pas concernés.
#     Note : cette règle était inopérante en coraza 3.3.3, qui ne levait jamais
#     `REQBODY_ERROR` — elle est indissociable de la montée en 3.7.0.
SecRule TX:mcp_json_body "@eq 1" \
    "id:10011,phase:2,deny,status:400,log,chain,\
     msg:'Corps JSON MCP non analysable — refuse (inspection WAF non garantie)',\
     logdata:'REQBODY_ERROR=%{REQBODY_ERROR} : %{REQBODY_ERROR_MSG}'"
    SecRule REQBODY_ERROR "!@eq 0"

#     (a) Query string : jamais légitime, sur AUCUN endpoint.
SecRule ARGS_GET_NAMES "@rx ^json\." \
    "id:10009,phase:2,deny,status:403,log,\
     msg:'Nom de parametre json.* forge en query string — tentative de contournement des exclusions WAF',\
     logdata:'Matched: %{MATCHED_VAR_NAME}'"

#     (b) Corps non analysé en JSON (ex. formulaire urlencodé) : un nom `json.*`
#         n'y est pas davantage légitime. Le drapeau serveur distingue le seul
#         cas licite — le corps JSON de POST /mcp analysé par la règle 10008.
SecRule ARGS_NAMES "@rx ^json\." \
    "id:10010,phase:2,deny,status:403,log,chain,\
     msg:'Nom de parametre json.* hors du corps JSON MCP analyse — tentative de contournement des exclusions WAF',\
     logdata:'Matched: %{MATCHED_VAR_NAME}'"
    SecRule TX:mcp_json_body "!@eq 1"

# ── Charger OWASP CoreRuleSet v4 (APRÈS les exclusions ci-dessus) ──
Include /opt/crs/crs-setup.conf
Include /opt/crs/rules/REQUEST-901-INITIALIZATION.conf
Include /opt/crs/rules/REQUEST-905-COMMON-EXCEPTIONS.conf
Include /opt/crs/rules/REQUEST-911-METHOD-ENFORCEMENT.conf
Include /opt/crs/rules/REQUEST-913-SCANNER-DETECTION.conf
Include /opt/crs/rules/REQUEST-920-PROTOCOL-ENFORCEMENT.conf
Include /opt/crs/rules/REQUEST-921-PROTOCOL-ATTACK.conf
Include /opt/crs/rules/REQUEST-930-APPLICATION-ATTACK-LFI.conf
Include /opt/crs/rules/REQUEST-931-APPLICATION-ATTACK-RFI.conf
Include /opt/crs/rules/REQUEST-932-APPLICATION-ATTACK-RCE.conf
Include /opt/crs/rules/REQUEST-933-APPLICATION-ATTACK-PHP.conf
Include /opt/crs/rules/REQUEST-934-APPLICATION-ATTACK-GENERIC.conf
Include /opt/crs/rules/REQUEST-941-APPLICATION-ATTACK-XSS.conf
Include /opt/crs/rules/REQUEST-942-APPLICATION-ATTACK-SQLI.conf
Include /opt/crs/rules/REQUEST-943-APPLICATION-ATTACK-SESSION-FIXATION.conf
Include /opt/crs/rules/REQUEST-944-APPLICATION-ATTACK-JAVA.conf
Include /opt/crs/rules/REQUEST-949-BLOCKING-EVALUATION.conf
Include /opt/crs/rules/RESPONSE-950-DATA-LEAKAGES.conf
Include /opt/crs/rules/RESPONSE-951-DATA-LEAKAGES-SQL.conf
Include /opt/crs/rules/RESPONSE-952-DATA-LEAKAGES-JAVA.conf
Include /opt/crs/rules/RESPONSE-953-DATA-LEAKAGES-PHP.conf
Include /opt/crs/rules/RESPONSE-954-DATA-LEAKAGES-IIS.conf
Include /opt/crs/rules/RESPONSE-959-BLOCKING-EVALUATION.conf
Include /opt/crs/rules/RESPONSE-980-CORRELATION.conf

# ══════════════════════════════════════════════════════════════════
# EXCLUSIONS DE CIBLES — DOIVENT SUIVRE L'INCLUDE DU CRS (issue #107)
# ══════════════════════════════════════════════════════════════════
#
# ⚠️ Sémantique INVERSE de la section « EXCLUSIONS RUNTIME » plus haut :
#   - `ctl:ruleRemoveById` agit sur la TRANSACTION → doit PRÉCÉDER
#     l'évaluation de la règle ciblée (cf. issue #42) ;
#   - `SecRuleUpdateTargetById` modifie la DÉFINITION de la règle au
#     chargement → la règle doit déjà être chargée, donc APRÈS l'Include.
#
# Pourquoi pas `ctl:ruleRemoveTargetById`, qui serait scopable par URI :
# vérifié sur Coraza 3.3.3, la forme regex (`ARGS_NAMES:/^json\.params\./`)
# n'est PAS supportée — seul un nom de cible exact fonctionne. Les clés de
# métadonnées client étant arbitraires, une liste de noms exacts n'est pas
# tenable dans le temps.
#
# ⚠️ Ces exclusions sont GLOBALES par nature, et leur sélecteur porte sur un NOM
# d'argument — donc sur une valeur choisie par le client. Elles ne sont PAS
# « inertes hors /mcp par construction » : `ARGS`/`ARGS_NAMES` agrègent aussi les
# paramètres de query string et de formulaire. Leur confinement à POST /mcp est
# assuré par les gardes 10009 et 10010 déclarées plus haut, qui REFUSENT tout nom
# d'argument préfixé `json.` en dehors du corps JSON MCP analysé.

# --- (a) 930120 : NOMS d'arguments sous l'enveloppe MCP `params._meta` ---
#     `_meta` est l'enveloppe de métadonnées du protocole MCP : ses clés sont
#     choisies par le client et ne sont JAMAIS interprétées par mcp-vault.
#     L'aplatissement JSON de Coraza concatène les clés avec un point : une
#     clé `environment` produit donc la sous-chaîne `.env` dans le NOM de
#     l'argument — `json.params._meta.x-codex-turn-metadata.environment.cwd` —
#     que 930120 matche via `lfi-os-files.data`.
#     Portée : les NOMS uniquement. Les VALEURS sous `_meta` restent inspectées.
SecRuleUpdateTargetById 930120 "!ARGS_NAMES:/^json\.params\._meta\./"

# --- (b) 930120 : VALEURS de l'argument `data` d'un appel d'outil MCP ---
#     `secret_write(data: dict)` est aujourd'hui le seul outil MCP recevant un
#     payload opaque (unique occurrence de `data: dict` dans server.py). Ce
#     contenu est transmis à OpenBao, qui le chiffre au repos ; il n'est jamais
#     interprété par mcp-vault comme un chemin, une requête SQL ou une commande.
#     mcp-vault expose même un type de secret `env_file` (« Fichier .env ») que
#     930120 rendait inutilisable.
#     ⚠️ HONNÊTETÉ DU SCOPING : le WAF ne connaît pas le schéma des outils. Le
#     sélecteur porte sur le CHEMIN JSON `params.arguments.data.*`, pas sur
#     `params.name == "secret_write"`. Un appel à un autre outil portant un
#     argument `data` bénéficierait donc de la même exclusion — sans effet
#     applicatif aujourd'hui (aucun autre outil n'accepte cet argument, et
#     FastMCP rejette les paramètres inconnus), mais la propriété repose sur
#     l'état actuel des signatures, pas sur une garantie du WAF.
#     Portée : les VALEURS sous `params.arguments.data.*` uniquement. Restent
#     inspectés : TOUS les noms d'arguments, et tous les champs de contrôle
#     (`vault_id`, `path`, `secret_type`, `tags`, nom de l'outil).
#     Vérifié : une traversal placée dans `data.*` reste bloquée par 930100 et
#     930110 (path traversal) et 932160 — exclure 930120 n'ouvre pas de LFI.
#     En revanche un simple nom de fichier sensible SANS traversal (ex. `.env`)
#     n'est plus détecté dans ces valeurs : c'est l'effet recherché.
SecRuleUpdateTargetById 930120 "!ARGS:/^json\.params\.arguments\.data\./"

# ── Exceptions MCP Vault ──────────────────────────────────────────
# Les exclusions de règles CRS (10001-10007) sont déclarées PLUS HAUT,
# AVANT l'Include du CRS (section « EXCLUSIONS RUNTIME »), car
# ctl:ruleRemoveById doit précéder l'évaluation des règles ciblées —
# phase:1 comprise (issue #42 : sinon 920440/920540 scorent avant l'exclusion).
#
# Les endpoints API (/mcp, /admin/api) restent protégés par Bearer token,
# policies MCP et owner-based isolation. Mode BLOCKING conservé partout.
