name: CI

# Le dépôt n'exécutait AUCUN test en intégration continue (issue #113) : la
# qualité des releases reposait entièrement sur des exécutions locales. Deux
# conséquences constatées — des tests rouges ont vécu plusieurs versions sans
# être vus (#98), et l'image de la v0.10.1 a atteint la qualification plateforme
# sans démarrer (#125), parce que rien ne construisait l'image ni ne vérifiait
# qu'elle importait son propre framework.
#
# Ce workflow construit l'IMAGE DE PRODUCTION LIVRÉE et la sonde, puis exécute
# la suite dans l'image de TEST — un stage distinct, non livré, mais bâti sur le
# même verrou et les mêmes sources. Les tests tournent donc sur les versions
# réellement installées en production, et non dans un environnement Python
# reconstitué qui ne prouverait rien sur l'image. Il ne remplace pas les tests
# e2e (opt-in, stack complète avec WAF et S3 de recette) : ceux-là restent hors
# CI.

on:
  pull_request:
    branches: [main]
  # Appelable par `release.yml`, qui en fait un `needs` de son job de
  # publication : aucun tag ni aucune release ne sort sans validation préalable.
  workflow_call:

# PAS de déclencheur `push: main` — délibéré (revue post-commit). Le dépôt
# travaille par PR (règle de projet, PAS une protection de branche : `main` n'a
# ni protection ni ruleset — vérifié), et `release.yml` rappelle explicitement ce
# workflow avant toute publication. Le conserver produisait deux exécutions
# concurrentes sur le même `github.ref`, donc dans le MÊME groupe de concurrence
# ci-dessous : avec `cancel-in-progress`, la CI appelée par la release pouvait
# être annulée par la CI autonome (ou l'inverse) — une garde de release non
# déterministe, en plus d'un coût doublé.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # La cible `production` porte le garde d'import à la construction
      # (issue #125) : une résolution de dépendances incompatible fait échouer
      # CETTE étape, et non le démarrage d'un conteneur en aval de la livraison.
      - name: Construire l'image de production
        run: docker build --target production -t mcp-vault:ci .

      # Le garde de construction prouve que l'import passe au BUILD. Ici on
      # vérifie la propriété complémentaire : l'image livrée contient bien la
      # version VERROUILLÉE, et non une version résolue librement.
      - name: Vérifier que l'image porte les versions verrouillées
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^mcp==\(.*\)$/\1/p' requirements.lock)"
          [ -n "$expected" ] || { echo "::error::mcp absent de requirements.lock"; exit 1; }
          installed="$(docker run --rm mcp-vault:ci \
            python -c "import importlib.metadata as m; print(m.version('mcp'))")"
          echo "mcp verrouillé=${expected} installé=${installed}"
          if [ "$installed" != "$expected" ]; then
            echo "::error::l'image installe mcp ${installed}, le verrou épingle ${expected}"
            exit 1
          fi
          docker run --rm mcp-vault:ci python -c "from mcp.server.fastmcp import FastMCP"

      - name: Construire l'image de test
        run: docker build --target test -t mcp-vault:ci-test .

      # ENTRYPOINT de la cible `test` = pytest sur tests/. C'est un stage
      # DISTINCT de `production` — pas l'artefact livré — mais il partage le
      # même verrou et les mêmes sources : la suite s'exécute donc sur les
      # versions réellement installées en production, et non sur celles d'un
      # environnement Python reconstitué. L'image livrée, elle, est construite
      # et sondée par les deux étapes précédentes.
      - name: Exécuter la suite de tests dans l'image
        run: docker run --rm mcp-vault:ci-test
